site_name: SerProt Protocols
site_url: https://shoyip.github.io/SerProtProtocols/
theme:
  name: material
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - sane_lists
  - pymdownx.tasklist:
      custom_checkbox: true
  - search
  - awesome-nav
nav:
  - index.md
  - Microfluidics:
      - microflu_microfab.md
      - microflu_encapsulation.md
      - microflu_sorting.md
      - microflu_cleaning.md
  - Plate Reader:
      - plate.md
  - Molecular Biology:
      - cloning.md
      - pretransformation_rca.md
      - transformation_starvation.md
  - Stocks of chemicals:
      - stock_sih.md
      - stock_substrate.md
